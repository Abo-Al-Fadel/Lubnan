# Everything the API needs to run locally, and nothing it does not.
#
# The obvious version of this file has postgres, redis, minio, a collector and
# a log viewer on day one. Five containers, four of them unused, and each one a
# thing that can be misconfigured in a way you will not notice until the phase
# that needs it. Services arrive here on the commit that starts using them:
#
#   redis    with distributed rate limiting and the L2 cache
#   minio    with presigned uploads
#   otel     when there is a trace worth reading
#
# Two ways to run it:
#
#   docker compose up -d                        postgres only, API from `dotnet run`
#   docker compose --profile full up -d --build  both, as they deploy
#
# The first is the development loop: rebuilding an image on every code change
# would add a minute to an edit that takes a second. The second is the one that
# proves the container actually works, and is what CI runs.

services:
  postgres:
    image: postgres:17-alpine
    container_name: lubnan-postgres
    environment:
      POSTGRES_USER: lubnan
      POSTGRES_PASSWORD: lubnan
      POSTGRES_DB: lubnan
      # Deterministic collation. Left to the host's locale, the sort order of
      # a text index differs between a developer's machine and the server, and
      # so does the set of rows a range query returns.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 5433 on the host, not 5432, deliberately.
      #
      # A container should not squat on the canonical port. Anyone who has ever
      # installed PostgreSQL natively — which the EDB installer does when you
      # want pgAdmin — already has a service on 5432, and the collision is
      # silent: Docker quietly binds IPv6 only, `localhost` resolves to IPv4
      # first, and your connection lands on the *other* database. The error you
      # get is "password authentication failed", which sends you looking at
      # credentials that were never wrong.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Named user and database: bare `pg_isready` reports the server is up
      # while the init scripts are still running, and the first migration then
      # races them.
      test: ["CMD-SHELL", "pg_isready -U lubnan -d lubnan"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lubnan-api
    depends_on:
      postgres:
        # Not just "started". Postgres accepts a TCP connection several seconds
        # before it will answer a query, so waiting on the container rather than
        # on the healthcheck means the API's first connection fails and the
        # whole stack looks broken on a cold start.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The service name, and the *internal* port. 5433 is a host-side detail
      # that does not exist on this network.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=lubnan;Username=lubnan;Password=lubnan"
      Cors__Origins__0: "http://localhost:3000"
    ports:
      - "5080:8080"

volumes:
  postgres-data:
